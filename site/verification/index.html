<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>私人雲端備份驗證</title><link rel="icon" href="../favicon.svg"><style>
:root{font-family:system-ui,sans-serif;color:#193747;background:#f5f6f3}body{max-width:960px;margin:auto;padding:24px}h1{font-size:28px}section{background:white;padding:20px;border:1px solid #ccd8d5;border-radius:14px;margin:18px 0}button,input,select{font:inherit;padding:12px;margin:6px 8px 6px 0;border:1px solid #77928d;border-radius:8px}button{background:#205b52;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}label{display:block;margin:12px 0}input{max-width:90%}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:48vh;overflow:auto;font-size:14px}p{line-height:1.8}.notice{border-left:5px solid #c79334;padding-left:14px}#status{font-weight:600}a{color:#205b52}small{display:block;line-height:1.8}svg{max-width:100%;max-height:440px}#preview{overflow:auto}@media(max-width:600px){body{padding:14px}button{width:100%;margin:6px 0}}
</style></head><body><h1>私人雲端備份驗證</h1><p class="notice">這是隔離驗證頁。模擬作答只存入「Learning Lab 私人雲端驗證」，不寫入正式學習歷史，也不計入學習成績。登入權限沿用既有 Google 設定。</p>
<section><label>驗證批次（兩個環境須相同）<input id="run" maxlength="36" autocomplete="off"></label><button id="connect" disabled>連接 Google</button><button id="disconnect" disabled>中斷連線</button><p id="status" role="status">正在核對服務…</p><a id="folder" hidden target="_blank" rel="noopener">開啟私人驗證資料夾</a><small>權杖僅保留於本頁記憶體。重新整理後須重連；驗證收據不含權杖或作答正文。</small></section>
<section><h2>雙向驗證</h2><p>A 環境先寫入兩版；B 環境讀回、核對全部欄位並回存第三版；最後 A 回讀第三版。同一批次可重試。</p><button id="write" disabled>A：寫入兩版</button><button id="restore" disabled>B：還原並回存</button><button id="return" disabled>A：回讀第三版</button><button id="baseline" disabled>正式歷史唯讀核對</button><button id="receipt">下載驗證收據</button><pre id="results" aria-live="polite"></pre></section>
<section><h2>核對圖解與匯入</h2><label>科目<select id="topic"><option value="structural-analysis">結構學</option><option value="reinforced-concrete">鋼筋混凝土</option><option value="steel-structures">鋼結構</option><option value="structural-dynamics">耐震設計及結構動力</option><option value="soil-foundations">土壤力學及大地工程</option></select></label><button id="snapshot" disabled>下載已讀回的第二版 JSON</button><label>核對從學習平台再匯出的 JSON<input id="compare" type="file" accept="application/json,.json"></label><p id="compare-result" role="status"></p><div id="preview"></div><small>下載後可在學習平台「功能測試空間」匯入，檢查歷史與圖形，再匯出回來核對。請勿將本頁模擬資料匯入正式學習空間。</small><a id="sandbox" target="_blank" rel="noopener">開啟功能測試空間</a></section><script type="module" src="verify.js"></script></body></html>
